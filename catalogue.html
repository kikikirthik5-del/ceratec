<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue Download — Ceratec</title>
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
</head>
<body class="bg-white text-slate-800 antialiased">
<div id="site-header"></div>

<main>
<section class="relative bg-[#05070d] text-white overflow-hidden">
  <div class="absolute inset-0 grid-bg"></div>
  <div class="relative max-w-7xl mx-auto px-4 py-16 md:py-24">
    <p class="text-sm text-slate-400"><a href="index.html" class="hover:text-white">Home</a> / Catalogue</p>
    <h1 class="mt-3 text-4xl md:text-6xl font-semibold tracking-tighter bg-gradient-to-br from-white from-30% to-white/50 bg-clip-text text-transparent">Download our catalogues</h1>
    <p class="mt-4 text-slate-400 max-w-2xl">Full technical specifications, cutting data and part numbers in PDF.</p>
  </div>
</section>

<section class="py-16 bg-slate-50">
  <div class="max-w-7xl mx-auto px-4">
    <div id="cgrid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
    <div class="mt-16 rounded-2xl border border-slate-200 bg-white p-8 md:p-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
      <div>
        <h2 class="text-2xl font-extrabold tracking-tight text-brand-900">Need a printed copy?</h2>
        <p class="mt-2 text-slate-600">Tell us where to send it and we'll post one to you.</p>
      </div>
      <a href="contact.html?product=Printed%20catalogue" class="h-11 px-6 inline-flex items-center justify-center rounded-md bg-brand-600 text-white font-semibold hover:bg-brand-700">Request printed catalogue</a>
    </div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script>document.getElementById('cgrid').innerHTML = CATALOGUES.map(catalogueCard).join('');</script>
</body>
</html>
