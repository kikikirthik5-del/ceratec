<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products — Ceratec</title>
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
</head>
<body class="bg-white text-slate-800 antialiased">
<div id="site-header"></div>

<main>
<section class="relative bg-[#05070d] text-white overflow-hidden">
  <div class="absolute inset-0 grid-bg"></div>
  <div class="relative max-w-7xl mx-auto px-4 py-16 md:py-24">
    <p class="text-sm text-slate-400"><a href="index.html" class="hover:text-white">Home</a> / Products</p>
    <h1 class="mt-3 text-4xl md:text-6xl font-semibold tracking-tighter bg-gradient-to-br from-white from-30% to-white/50 bg-clip-text text-transparent">Our product range</h1>
    <p class="mt-4 text-slate-400 max-w-2xl">End mills, drills, inserts, threading and special tools. Search by keyword or filter by category.</p>
  </div>
</section>

<section class="py-16 bg-slate-50 min-h-[60vh]">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div id="cats" class="flex flex-wrap gap-2"></div>
      <div class="relative w-full md:w-80">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input id="pq" oninput="renderProducts()" type="search" aria-label="Filter products" placeholder="Filter by keyword (e.g. drill, carbide)" class="w-full h-11 pl-9 pr-3 rounded-md border border-slate-300 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
    </div>
    <p id="pcount" class="mt-6 text-sm text-slate-500"></p>
    <div id="pgrid" class="mt-4 grid sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
    <p id="pempty" class="hidden mt-10 text-center text-slate-500">No products match your search. <a href="contact.html" class="text-brand-600 font-semibold hover:underline">Ask us for a custom tool →</a></p>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script>
const CATS = ['All', ...new Set(PRODUCTS.map(p => p.cat))];
let activeCat = 'All';
function setCat(c) { activeCat = c; renderProducts(); }
function renderProducts() {
  const q = document.getElementById('pq').value.trim().toLowerCase();
  document.getElementById('cats').innerHTML = CATS.map(c =>
    `<button onclick="setCat('${c}')" class="h-9 px-4 rounded-full text-sm font-medium border ${c === activeCat ? 'bg-brand-600 text-white border-brand-600' : 'bg-white border-slate-300 hover:border-slate-400'}">${c}</button>`).join('');
  const list = PRODUCTS.filter(p => (activeCat === 'All' || p.cat === activeCat) && matches(p, q));
  document.getElementById('pgrid').innerHTML = list.map(productCard).join('');
  document.getElementById('pcount').textContent = `${list.length} product${list.length === 1 ? '' : 's'}`;
  document.getElementById('pempty').classList.toggle('hidden', list.length > 0);
}
// search from the header lands here as ?q=
document.getElementById('pq').value = new URLSearchParams(location.search).get('q') || '';
renderProducts();
</script>
</body>
</html>
