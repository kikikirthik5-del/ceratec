<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Ceratec</title>
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
</head>
<body class="bg-white text-slate-800 antialiased">
<div id="site-header"></div>

<main>
<section class="relative bg-[#05070d] text-white overflow-hidden">
  <div class="absolute inset-0 grid-bg"></div>
  <div class="relative max-w-7xl mx-auto px-4 py-16 md:py-24">
    <p class="text-sm text-slate-400"><a href="index.html" class="hover:text-white">Home</a> / Contact</p>
    <h1 class="mt-3 text-4xl md:text-6xl font-semibold tracking-tighter bg-gradient-to-br from-white from-30% to-white/50 bg-clip-text text-transparent">Get in touch</h1>
    <p class="mt-4 text-slate-400 max-w-2xl">Share your drawing or requirement and our engineers will get back within 24 hours.</p>
  </div>
</section>

<section class="py-16">
  <div class="max-w-7xl mx-auto px-4 grid lg:grid-cols-5 gap-10">
    <div class="lg:col-span-2 space-y-4" id="cinfo"></div>
    <form id="cform" class="lg:col-span-3 rounded-2xl border border-slate-200 p-6 md:p-8 grid gap-4">
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="grid gap-1.5 text-sm font-medium">Name<input required name="name" class="h-11 px-3 rounded-md border border-slate-300 font-normal focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
        <label class="grid gap-1.5 text-sm font-medium">Email<input required type="email" name="email" class="h-11 px-3 rounded-md border border-slate-300 font-normal focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="grid gap-1.5 text-sm font-medium">Company<input name="company" class="h-11 px-3 rounded-md border border-slate-300 font-normal focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
        <label class="grid gap-1.5 text-sm font-medium">Phone<input type="tel" name="phone" class="h-11 px-3 rounded-md border border-slate-300 font-normal focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
      </div>
      <label class="grid gap-1.5 text-sm font-medium">Product / subject<input id="cproduct" name="product" class="h-11 px-3 rounded-md border border-slate-300 font-normal focus:outline-none focus:ring-2 focus:ring-brand-500"></label>
      <label class="grid gap-1.5 text-sm font-medium">Your requirement<textarea rows="5" name="message" class="px-3 py-2 rounded-md border border-slate-300 font-normal focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea></label>
      <button class="h-11 rounded-md bg-brand-600 text-white font-semibold hover:bg-brand-700">Send Enquiry</button>
      <p id="cdone" class="hidden text-sm text-green-700">Thanks! (Placeholder: this form isn't connected to email yet.)</p>
    </form>
  </div>
  <div class="max-w-7xl mx-auto px-4 mt-10">
    <div class="ph rounded-2xl aspect-[21/7] grid place-items-center text-slate-400 text-sm">Google Map embed</div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script>
const card = (title, body) => `<div class="rounded-xl border border-slate-200 p-5"><div class="text-sm font-semibold text-brand-600">${title}</div><div class="mt-1 text-slate-700">${body}</div></div>`;
document.getElementById('cinfo').innerHTML =
  card('Address', CONTACT.address.join('<br>')) +
  card('Phone', `<a href="tel:${CONTACT.phone.replace(/\s/g, '')}" class="hover:underline">${CONTACT.phone}</a>`) +
  card('Email', `<a href="mailto:${CONTACT.sales}" class="hover:underline">${CONTACT.sales}</a>`) +
  `<a href="${CONTACT.whatsapp}" target="_blank" rel="noopener" class="h-11 inline-flex items-center gap-2 px-5 rounded-md bg-[#25D366] text-white font-semibold hover:opacity-90">Chat on WhatsApp</a>`;
// "Enquire" buttons pass the product name as ?product=
document.getElementById('cproduct').value = new URLSearchParams(location.search).get('product') || '';
document.getElementById('cform').addEventListener('submit', e => {
  e.preventDefault(); e.target.reset(); document.getElementById('cdone').classList.remove('hidden');
});
</script>
</body>
</html>
